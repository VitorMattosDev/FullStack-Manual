<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FullStack Quest — Jogo de revisão da coleção</title>
<meta name="description" content="Jogo de revisão gamificado da coleção FullStack Manual: exercícios progressivos dos 20 volumes, com XP, níveis, conquistas e progresso salvo no navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0d0b; --bg-2: #17130f; --panel: #1c1712; --panel-2: #241d17;
    --border: #2d251d; --border-strong: #3a3024;
    --text: #f2ede4; --text-2: #cfc5b4; --muted: #a39a8e; --dim: #6a6258;
    --accent: #f0a830; --accent-2: #e08c2a; --accent-soft: rgba(240, 168, 48, 0.12);
    --teal: #5eead4; --rose: #f5a8a8; --sage: #b0c98c; --sky: #7dd3fc;
    --ok: #9bd17a; --ok-soft: rgba(155, 209, 122, 0.12);
    --err: #f08a8a; --err-soft: rgba(240, 138, 138, 0.12);
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 16px; line-height: 1.6; min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(240, 168, 48, 0.05) 0%, transparent 50%),
      radial-gradient(circle at 90% 20%, rgba(125, 211, 252, 0.03) 0%, transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(176, 201, 140, 0.025) 0%, transparent 45%);
  }
  a { color: inherit; }
  .page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

  /* ─── TOP BAR ─── */
  .topbar {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding-bottom: 1.5rem; margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; flex-shrink: 0; }
  .brand-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: grid; place-items: center; color: var(--bg);
    font-family: var(--font-mono); font-weight: 700; font-size: 1.5rem;
    box-shadow: 0 8px 28px rgba(240,168,48,0.25);
  }
  .brand-text .title { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; line-height: 1.05; letter-spacing: -0.02em; }
  .brand-text .title em { font-style: italic; color: var(--accent); }
  .brand-text .sub { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .stats { display: flex; align-items: center; gap: 1.25rem; margin-left: auto; flex-wrap: wrap; }
  .stat { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.95rem; }
  .stat .ico { font-size: 1.15rem; }
  .stat .big { font-weight: 700; color: var(--text); }
  .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .home-link { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-2); text-decoration: none; border-bottom: 1px dotted var(--border-strong); padding-bottom: 1px; transition: color .18s, border-color .18s; }
  .home-link:hover { color: var(--accent); border-color: var(--accent); }

  /* ─── LEVEL BAR ─── */
  .levelbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.25rem; }
  .level-badge {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 16px;
    background: var(--panel); border: 1.5px solid var(--accent);
  }
  .level-badge .n { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--accent); line-height: 1; }
  .level-badge .t { font-family: var(--font-mono); font-size: 0.55rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .xp-wrap { flex: 1; }
  .xp-meta { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; }
  .xp-meta strong { color: var(--text); }
  .xp-track { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; height: 12px; overflow: hidden; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 999px; transition: width .8s ease; }

  /* ─── BADGES ─── */
  .badges { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 2.5rem; }
  .badge {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.45rem 0.8rem; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 0.8rem; color: var(--dim); opacity: 0.55;
    transition: opacity .2s, border-color .2s, color .2s, background .2s;
  }
  .badge.earned { opacity: 1; color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .badge .e { font-size: 1.1rem; filter: grayscale(1); }
  .badge.earned .e { filter: none; }

  /* ─── PHASES / CARDS ─── */
  .phase { margin-top: 2.5rem; }
  .phase-head { display: flex; align-items: baseline; gap: 0.9rem; margin-bottom: 1.1rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
  .phase-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
  .phase-title { font-family: var(--font-display); font-weight: 500; font-size: 1.4rem; letter-spacing: -0.01em; }
  .phase-prog { margin-left: auto; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.9rem; }

  .card {
    text-align: left; cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.15rem 1.1rem; position: relative; overflow: hidden;
    transition: transform .16s, border-color .16s, box-shadow .16s, background .16s;
  }
  .card:hover:not(.locked) { transform: translateY(-3px); border-color: var(--border-strong); background: var(--panel-2); box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; }
  .mark { font-family: var(--font-mono); font-weight: 700; font-size: 1rem; width: 42px; height: 42px; display: grid; place-items: center; border: 1.5px solid var(--border-strong); border-radius: 10px; color: var(--text-2); }
  .card:hover:not(.locked) .mark { color: var(--accent); border-color: var(--accent); }
  .vol { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .card-title { font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; line-height: 1.2; margin-bottom: 0.7rem; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; font-family: var(--font-mono); font-size: 0.74rem; }
  .card-state { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .card.done .dot { background: var(--ok); }
  .card.open .dot { background: var(--accent); }
  .card .score { color: var(--ok); font-weight: 700; }
  .card.locked { opacity: 0.5; cursor: not-allowed; border-style: dashed; }
  .card.locked .lock { font-size: 0.95rem; }
  .stars { letter-spacing: 1px; }

  /* ─── QUIZ SCREEN ─── */
  .quiz-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.75rem; }
  .qt-back { background: var(--panel); border: 1px solid var(--border); color: var(--text-2); border-radius: 10px; padding: 0.5rem 0.8rem; cursor: pointer; font: inherit; font-size: 0.85rem; transition: border-color .15s, color .15s; }
  .qt-back:hover { border-color: var(--accent); color: var(--accent); }
  .qbar { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; height: 12px; overflow: hidden; }
  .qbar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 999px; transition: width .35s ease; }
  .hearts { font-size: 1.15rem; letter-spacing: 2px; flex-shrink: 0; min-width: 70px; text-align: right; }

  .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 1.75rem 1.6rem; }
  .qkind { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 0.7rem; }
  .qtext { font-family: var(--font-display); font-weight: 500; font-size: 1.4rem; line-height: 1.3; margin-bottom: 1.25rem; letter-spacing: -0.01em; }
  .qtext code, .opt code, .feedback code { font-family: var(--font-mono); font-size: 0.86em; background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px; padding: 0.05em 0.35em; color: var(--teal); }

  .codeblock { background: #110e0a; border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1.25rem; overflow-x: auto; }
  .codeblock pre { font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.7; color: var(--text-2); white-space: pre; }
  .blank { display: inline-block; min-width: 60px; border-bottom: 2px solid var(--accent); color: var(--accent); text-align: center; }

  .opts { display: flex; flex-direction: column; gap: 0.6rem; }
  .opt {
    text-align: left; font: inherit; color: var(--text); cursor: pointer;
    background: var(--bg-2); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 0.85rem 1rem; display: flex; align-items: center; gap: 0.75rem;
    transition: border-color .14s, background .14s, transform .1s;
  }
  .opt:hover:not(:disabled) { border-color: var(--border-strong); }
  .opt:disabled { cursor: default; }
  .opt .key { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); border: 1px solid var(--border-strong); border-radius: 6px; width: 24px; height: 24px; display: grid; place-items: center; flex-shrink: 0; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--err); background: var(--err-soft); }
  .opt.correct .key { border-color: var(--ok); color: var(--ok); }
  .opt.wrong .key { border-color: var(--err); color: var(--err); }

  .fill-input { width: 100%; font-family: var(--font-mono); font-size: 1rem; background: var(--bg-2); border: 1.5px solid var(--border); border-radius: 12px; padding: 0.85rem 1rem; color: var(--teal); outline: none; transition: border-color .15s; }
  .fill-input:focus { border-color: var(--accent); }
  .fill-input.correct { border-color: var(--ok); color: var(--ok); }
  .fill-input.wrong { border-color: var(--err); color: var(--err); }

  /* ordering */
  .order-seq { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.9rem; min-height: 8px; }
  .order-slot { display: flex; align-items: center; gap: 0.7rem; background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 10px; padding: 0.6rem 0.85rem; cursor: pointer; }
  .order-slot .num { font-family: var(--font-mono); font-weight: 700; color: var(--accent); }
  .order-pool { display: flex; flex-direction: column; gap: 0.5rem; }
  .order-item { text-align: left; font: inherit; color: var(--text); cursor: pointer; background: var(--bg-2); border: 1.5px solid var(--border); border-radius: 10px; padding: 0.65rem 0.85rem; transition: border-color .14s; }
  .order-item:hover { border-color: var(--border-strong); }
  .order-help { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.6rem; }
  .order-seq.correct .order-slot { border-color: var(--ok); background: var(--ok-soft); }
  .order-seq.correct .order-slot .num { color: var(--ok); }
  .order-seq.wrong .order-slot { border-color: var(--err); background: var(--err-soft); }
  .order-seq.wrong .order-slot .num { color: var(--err); }

  .feedback { margin-top: 1.25rem; border-radius: 12px; padding: 0.95rem 1.1rem; border: 1px solid var(--border); display: none; }
  .feedback.show { display: block; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
  .feedback.no { border-color: var(--err); background: var(--err-soft); }
  .feedback .fb-title { font-weight: 600; margin-bottom: 0.25rem; }
  .feedback.ok .fb-title { color: var(--ok); }
  .feedback.no .fb-title { color: var(--err); }
  .feedback .fb-body { color: var(--text-2); font-size: 0.92rem; }

  .qactions { margin-top: 1.5rem; display: flex; justify-content: flex-end; }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 12px;
    padding: 0.8rem 1.8rem; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--bg); transition: transform .12s, box-shadow .12s, opacity .12s;
    box-shadow: 0 6px 20px -6px rgba(240,168,48,.5);
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: var(--panel); color: var(--text-2); border: 1px solid var(--border); box-shadow: none; }
  .btn.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

  /* ─── RESULTS ─── */
  .result { text-align: center; max-width: 560px; margin: 1rem auto; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; }
  .result .r-emoji { font-size: 3.5rem; line-height: 1; margin-bottom: 0.5rem; }
  .result h2 { font-family: var(--font-display); font-weight: 600; font-size: 2rem; margin-bottom: 0.4rem; }
  .result .r-sub { color: var(--muted); margin-bottom: 1.75rem; }
  .r-stats { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .r-stat { background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.4rem; min-width: 110px; }
  .r-stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; color: var(--accent); }
  .r-stat .l { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .r-actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
  .r-new-badges { margin: 0 0 1.5rem; display: flex; flex-direction: column; gap: 0.4rem; align-items: center; }
  .r-new-badges .nb { color: var(--accent); font-family: var(--font-mono); font-size: 0.85rem; }
  .read-link { display: inline-block; margin-top: 1.4rem; font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-2); text-decoration: none; border-bottom: 1px dotted var(--border-strong); }
  .read-link:hover { color: var(--accent); border-color: var(--accent); }

  .toolbar { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1rem; }

  /* level up toast */
  .toast { position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%) translateY(120%); background: var(--panel-2); border: 1.5px solid var(--accent); border-radius: 14px; padding: 0.9rem 1.4rem; box-shadow: 0 12px 40px -8px rgba(0,0,0,.6); font-family: var(--font-mono); font-size: 0.92rem; z-index: 50; transition: transform .4s cubic-bezier(.2,.9,.3,1.3); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast strong { color: var(--accent); }

  @media (max-width: 640px) {
    .page { padding: 1.5rem 1rem 4rem; }
    .stats { width: 100%; margin-left: 0; justify-content: space-between; }
    .qtext { font-size: 1.2rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="page" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   FullStack Quest — engine de revisão gamificada
   Dados → MODULES (20 volumes da coleção). Estado em localStorage.
   ════════════════════════════════════════════════════════════════ */

const PHASES = [
  { id: 1, label: "Fase 01", title: "A base da web" },
  { id: 2, label: "Fase 02", title: "Programar" },
  { id: 3, label: "Fase 03", title: "Ferramentas do ofício" },
  { id: 4, label: "Fase 04", title: "Interfaces modernas" },
  { id: 5, label: "Fase 05", title: "Backend e dados" },
  { id: 6, label: "Fase 06", title: "Produção e extras" },
  { id: 7, label: "Fase 07", title: "Qualidade e operação" },
  { id: 8, label: "Fase 08", title: "Junte tudo" },
];

/* tipos de questão:
   mc     → múltipla escolha   { q, options:[], answer:idx, explain }
   vf     → verdadeiro/falso   { q, answer:true|false, explain }
   fill   → completar código   { q, code, accept:[], explain }   (code usa ___ como lacuna)
   output → prever a saída     { q, code, options:[], answer:idx, explain }
   order  → ordenar passos     { q, items:[...ordem correta], explain }
*/

const MODULES = [
  /* ─── FASE 1 ─── */
  { id:"html", step:1, vol:"Vol III", mark:"Hs", phase:1, title:"HTML semântico + a11y", file:"pages/manual-html.html", questions:[
    { type:"mc", q:"Qual elemento marca o conteúdo principal e único de uma página?", options:["<code>&lt;div&gt;</code>","<code>&lt;main&gt;</code>","<code>&lt;section&gt;</code>","<code>&lt;article&gt;</code>"], answer:1, explain:"<code>&lt;main&gt;</code> é o marco do conteúdo central; deve haver apenas um por página e leitores de tela o usam como ponto de salto." },
    { type:"vf", q:"O atributo alt deve sempre ter texto descritivo, mesmo em imagens puramente decorativas.", answer:false, explain:"Imagens decorativas usam alt=\"\" (vazio) para que leitores de tela as ignorem. O alt descritivo é só para imagens informativas." },
    { type:"fill", q:"Associe um rótulo ao campo: o atributo do &lt;label&gt; aponta para o id do input.", code:'<label ___="email">E-mail</label>\n<input id="email" type="email">', accept:["for"], explain:"<code>for</code> liga o &lt;label&gt; ao input pelo id — clicar no rótulo foca o campo e o leitor de tela anuncia o nome." },
    { type:"mc", q:"Por que pular de &lt;h1&gt; direto para &lt;h3&gt; é um problema?", options:["Deixa a fonte menor","Quebra a hierarquia do documento que a navegação assistiva usa","É inválido em HTML5","Impede o CSS de aplicar"], answer:1, explain:"Os níveis de heading formam o sumário do documento. Saltos confundem a navegação por headings de leitores de tela." },
    { type:"order", q:"Ordene a estrutura semântica típica de uma página, de cima para baixo:", items:["<code>&lt;header&gt;</code>","<code>&lt;nav&gt;</code>","<code>&lt;main&gt;</code>","<code>&lt;footer&gt;</code>"], explain:"Cabeçalho e navegação no topo, conteúdo principal no meio, rodapé ao final — landmarks que dão estrutura à página." },
  ]},
  { id:"css", step:2, vol:"Vol IV", mark:"Cs", phase:1, title:"CSS moderno", file:"pages/manual-css.html", questions:[
    { type:"mc", q:"Qual valor faz padding e border serem incluídos na largura definida do elemento?", options:["box-sizing: content-box","box-sizing: border-box","overflow: hidden","display: flex"], answer:1, explain:"<code>border-box</code> faz width incluir padding e border — o padrão moderno que evita estouros de largura." },
    { type:"mc", q:"Entre <code>#id</code>, <code>.classe</code> e <code>div</code>, qual seletor tem maior especificidade?", options:[".classe","div","#id","Todos iguais"], answer:2, explain:"A ordem de especificidade é id (#) > classe (.) > tipo (tag). Por isso #id vence em conflitos." },
    { type:"fill", q:"Crie uma grid de 3 colunas de larguras iguais:", code:".lista {\n  display: grid;\n  grid-template-columns: ___;\n}", accept:["repeat(3, 1fr)","repeat(3,1fr)","1fr 1fr 1fr"], explain:"<code>repeat(3, 1fr)</code> divide o espaço em três frações iguais — equivalente a <code>1fr 1fr 1fr</code>." },
    { type:"vf", q:"Container queries permitem estilizar com base no tamanho do contêiner pai, não da viewport.", answer:true, explain:"Diferente de media queries (viewport), container queries reagem ao tamanho do contêiner — ideal para componentes reutilizáveis." },
    { type:"mc", q:"Num container <code>display: flex</code> (linha), qual propriedade alinha os itens no eixo principal (horizontal)?", options:["align-items","justify-content","place-items","flex-wrap"], answer:1, explain:"<code>justify-content</code> distribui no eixo principal; <code>align-items</code> alinha no eixo cruzado." },
  ]},

  /* ─── FASE 2 ─── */
  { id:"javascript", step:3, vol:"Vol II", mark:"Js", phase:2, title:"JavaScript moderno", file:"pages/javascript.html", questions:[
    { type:"output", q:"Qual é a saída?", code:'console.log(typeof null);', options:['"null"','"object"','"undefined"','undefined'], answer:1, explain:"<code>typeof null</code> é \"object\" — um bug histórico da linguagem mantido por compatibilidade." },

const BADGES = [
  { id:"first",    emoji:"🌱", name:"Primeiros Passos", test:s => completedCount(s) >= 1 },
  { id:"five",     emoji:"⚡", name:"Aquecendo",        test:s => completedCount(s) >= 5 },
  { id:"perfect",  emoji:"💎", name:"Impecável",        test:s => Object.values(s.completed).some(c => c.perfect) },
  { id:"frontend", emoji:"🎨", name:"Front-end",        test:s => ["html","css","javascript","typescript","react","tailwind","nextjs"].every(id => s.completed[id]) },
  { id:"backend",  emoji:"🛠️", name:"Back-end",        test:s => ["nodejs","hono","sql","drizzle","zod","auth"].every(id => s.completed[id]) },
  { id:"streak7",  emoji:"🔥", name:"Em Chamas",        test:s => (s.streak && s.streak.count >= 7) },
  { id:"ten",      emoji:"🚀", name:"Meia Trilha",      test:s => completedCount(s) >= 10 },
  { id:"all",      emoji:"👑", name:"Full Stack",       test:s => completedCount(s) >= MODULES.length },
];

/* ─── estado ─── */
const SKEY = "fullstack-quest-v1";
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SKEY));
    if (s && typeof s === "object") return normalize(s);
  } catch (e) {}
  return normalize({});
}
function normalize(s) {
  return {
    xp: s.xp || 0,
    completed: s.completed || {},      // { moduleId: { correct, total, perfect, xp } }
    badges: s.badges || [],            // [badgeId]
    streak: s.streak || { count: 0, last: null },
    missed: s.missed || [],            // [{ m, i }]
  };
}
function save() { localStorage.setItem(SKEY, JSON.stringify(state)); }
let state = load();

/* ─── helpers ─── */
function completedCount(s) { return Object.keys(s.completed).length; }
function moduleById(id) { return MODULES.find(m => m.id === id); }
function orderedModules() { return [...MODULES].sort((a, b) => a.step - b.step); }
function isUnlocked(mod) {
  return true; // acesso livre: todos os módulos sempre disponíveis (XP/badges/streak preservados)
}
function esc(s) { return String(s).replace(/&(?!(amp|lt|gt|quot|#39);)/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function normFill(s) { return String(s).trim().toLowerCase().replace(/\s+/g, " ").replace(/;+$/, "").replace(/^["']|["']$/g, "").replace(/^["']|["']$/g, ""); }
function levelInfo(xp) {
  let lvl = 1, need = 100, acc = 0;
  while (xp >= acc + need) { acc += need; lvl++; need = Math.round(need * 1.4); }
  return { lvl, into: xp - acc, need, pct: Math.round(((xp - acc) / need) * 100) };
}
function updateStreak() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.streak.last === today) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  state.streak.count = (state.streak.last === y) ? state.streak.count + 1 : 1;
  state.streak.last = today;
  save();
}
function refreshBadges() {
  const newly = [];
  for (const b of BADGES) {
    if (!state.badges.includes(b.id) && b.test(state)) { state.badges.push(b.id); newly.push(b); }
  }
  if (newly.length) save();
  return newly;
}
function toast(html) {
  const t = document.getElementById("toast");
  t.innerHTML = html; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

const ROMAN = {}; // not needed; vol comes from data

/* ════════════════ TELA: HUB ════════════════ */
function renderHub() {
  updateStreak();
  const li = levelInfo(state.xp);
  const done = completedCount(state);
  const ord = orderedModules();

  const stats = `
    <div class="stats">
      <div class="stat"><span class="ico">🔥</span><span><span class="big">${state.streak.count}</span> <span class="lbl">streak</span></span></div>
      <div class="stat"><span class="ico">✨</span><span><span class="big">${state.xp}</span> <span class="lbl">XP</span></span></div>
      <div class="stat"><span class="ico">🏅</span><span><span class="big">${state.badges.length}</span><span class="lbl">/${BADGES.length} badges</span></span></div>
      <a class="home-link" href="index.html">← Coleção</a>
    </div>`;

  const levelbar = `
    <div class="levelbar">
      <div class="level-badge"><span class="n">${li.lvl}</span><span class="t">Nível</span></div>
      <div class="xp-wrap">
        <div class="xp-meta"><span>Nível ${li.lvl}</span><span><strong>${li.into}</strong> / ${li.need} XP p/ o próximo</span></div>
        <div class="xp-track"><div class="xp-fill" style="width:${li.pct}%"></div></div>
      </div>
    </div>`;

  const badges = `<div class="badges">` + BADGES.map(b => {
    const got = state.badges.includes(b.id);
    return `<div class="badge ${got ? "earned" : ""}" title="${esc(b.name)}"><span class="e">${b.emoji}</span><span>${esc(b.name)}</span></div>`;
  }).join("") + `</div>`;

  const missedN = state.missed.length;
  const toolbar = `
    <div class="toolbar">
      <button class="btn ghost" ${missedN ? "" : "disabled"} onclick="startReview()">🔁 Revisar erros${missedN ? " (" + missedN + ")" : ""}</button>
      <button class="btn ghost" onclick="resetAll()">↺ Zerar progresso</button>
    </div>`;

  const phasesHtml = PHASES.map(ph => {
    const mods = ord.filter(m => m.phase === ph.id);
    const doneP = mods.filter(m => state.completed[m.id]).length;
    const cards = mods.map(m => {
      const c = state.completed[m.id];
      const unlocked = isUnlocked(m);
      let stateCls = unlocked ? (c ? "done" : "open") : "locked";
      let foot;
      if (!unlocked) {
        foot = `<span class="card-state"><span class="lock">🔒</span> Bloqueado</span>`;
      } else if (c) {
        const stars = "★".repeat(scoreStars(c)) + "☆".repeat(3 - scoreStars(c));
        foot = `<span class="card-state"><span class="dot"></span> ${c.correct}/${c.total}</span><span class="score stars">${stars}</span>`;
      } else {
        foot = `<span class="card-state"><span class="dot"></span> Jogar</span><span class="score">→</span>`;
      }
      const onclick = unlocked ? `onclick="startModule('${m.id}')"` : "";
      return `
        <button class="card ${stateCls}" ${onclick}>
          <div class="card-top"><div class="mark">${m.mark}</div><span class="vol">Passo ${m.step} · ${m.vol}</span></div>
          <div class="card-title">${esc(m.title)}</div>
          <div class="card-foot">${foot}</div>
        </button>`;
    }).join("");
    return `
      <section class="phase">
        <div class="phase-head">
          <span class="phase-label">${ph.label}</span>
          <h2 class="phase-title">${esc(ph.title)}</h2>
          <span class="phase-prog">${doneP}/${mods.length}</span>
        </div>
        <div class="grid">${cards}</div>
      </section>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <a class="brand" href="index.html">
        <div class="brand-mark">FS</div>
        <div class="brand-text"><div class="title">FullStack <em>Quest</em></div><div class="sub">Revisão · ${done}/${MODULES.length} módulos</div></div>
      </a>
      ${stats}
    </div>
    ${levelbar}
    ${badges}
    ${toolbar}
    ${phasesHtml}
    <footer style="margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem;font-family:var(--font-mono);">
      Consolide a coleção FullStack Manual jogando · progresso salvo neste navegador
    </footer>`;
  window.scrollTo(0, 0);
}
function scoreStars(c) {
  const r = c.correct / c.total;
  if (r >= 1) return 3;
  if (r >= 0.7) return 2;
  if (r >= 0.4) return 1;
  return 0;
}

/* ════════════════ QUIZ ════════════════ */
let session = null;
const HEARTS_START = 3;

function startModule(id) {
  const mod = moduleById(id);
  if (!mod || !isUnlocked(mod)) return;
  session = {
    mode: "module", mod, queue: mod.questions.map((q, i) => ({ q, i })),
    idx: 0, correct: 0, mistakes: 0, hearts: HEARTS_START, answered: false, picked: null, seq: [],
  };
  renderQuestion();
}
function startReview() {
  if (!state.missed.length) return;
  const items = state.missed.map(ref => {
    const mod = moduleById(ref.m); if (!mod) return null;
    const q = mod.questions[ref.i]; if (!q) return null;
    return { q, ref, modTitle: mod.title };
  }).filter(Boolean);
  if (!items.length) { state.missed = []; save(); renderHub(); return; }
  session = {
    mode: "review", queue: items, idx: 0, correct: 0, mistakes: 0,
    hearts: 99, answered: false, picked: null, seq: [], clearedRefs: [],
  };
  renderQuestion();
}

function renderQuestion() {
  const s = session;
  const item = s.queue[s.idx];
  const q = item.q;
  s.answered = false; s.picked = null; s.seq = [];

  const total = s.queue.length;
  const pct = Math.round((s.idx / total) * 100);
  const hearts = s.mode === "review"
    ? `<span class="hearts">🔁 revisão</span>`
    : `<span class="hearts">${"❤️".repeat(s.hearts)}${"🖤".repeat(HEARTS_START - s.hearts)}</span>`;
  const title = s.mode === "review" ? "Revisão de erros" : s.mod.title;

  const kindLabel = { mc:"Múltipla escolha", vf:"Verdadeiro ou falso", fill:"Complete o código", output:"Qual a saída?", order:"Ordene os passos" }[q.type];

  let body = "";
  if (q.code && q.type !== "fill") {
    body += `<div class="codeblock"><pre>${esc(q.code)}</pre></div>`;
  }
  body += `<div class="qtext">${q.q}</div>`;

  if (q.type === "mc" || q.type === "output") {
    body += `<div class="opts">` + q.options.map((o, i) =>
      `<button class="opt" data-i="${i}" onclick="pick(${i})"><span class="key">${String.fromCharCode(65 + i)}</span><span>${o}</span></button>`
    ).join("") + `</div>`;
  } else if (q.type === "vf") {
    body += `<div class="opts">
      <button class="opt" data-i="1" onclick="pick(1)"><span class="key">V</span><span>Verdadeiro</span></button>
      <button class="opt" data-i="0" onclick="pick(0)"><span class="key">F</span><span>Falso</span></button>
    </div>`;
  } else if (q.type === "fill") {
    const codeHtml = esc(q.code).replace("___", '<span class="blank" id="blankSlot">␣␣␣</span>');
    body += `<div class="codeblock"><pre>${codeHtml}</pre></div>`;
    body += `<input class="fill-input" id="fillInput" placeholder="digite o que falta na lacuna…" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  } else if (q.type === "order") {
    body += `<div class="order-help">Clique na ordem correta. Clique num item da sequência para devolvê-lo.</div>`;
    body += `<div class="order-seq" id="orderSeq"></div>`;
    body += `<div class="order-pool" id="orderPool"></div>`;
  }

  document.getElementById("app").innerHTML = `
    <div class="quiz-top">
      <button class="qt-back" onclick="quitToHub()">← Sair</button>
      <div class="qbar"><div class="qbar-fill" style="width:${pct}%"></div></div>
      ${hearts}
    </div>
    <div style="font-family:var(--font-mono);font-size:.75rem;color:var(--muted);margin-bottom:.6rem;">${esc(title)} · questão ${s.idx + 1}/${total}</div>
    <div class="qcard">
      <div class="qkind">${kindLabel}</div>
      ${body}
      <div class="feedback" id="feedback"><div class="fb-title" id="fbTitle"></div><div class="fb-body" id="fbBody"></div></div>
      <div class="qactions"><button class="btn" id="actionBtn" disabled onclick="verify()">Verificar</button></div>
    </div>`;
  window.scrollTo(0, 0);

  if (q.type === "fill") {
    const inp = document.getElementById("fillInput");
    inp.focus();
    inp.addEventListener("input", () => { document.getElementById("actionBtn").disabled = inp.value.trim() === ""; });
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !document.getElementById("actionBtn").disabled) verify(); });
  } else if (q.type === "order") {
    renderOrder();
  }
}

/* seleção de múltipla escolha / VF */
function pick(i) {
  if (session.answered) return;
  session.picked = i;
  document.querySelectorAll(".opt").forEach(el => el.classList.toggle("sel", +el.dataset.i === i));
  document.getElementById("actionBtn").disabled = false;
}

/* ordering */
function renderOrder() {
  const q = session.queue[session.idx].q;
  const seqEl = document.getElementById("orderSeq");
  const poolEl = document.getElementById("orderPool");
  seqEl.innerHTML = session.seq.map((origIdx, pos) =>
    `<div class="order-slot" onclick="orderRemove(${pos})"><span class="num">${pos + 1}</span><span>${q.items[origIdx]}</span></div>`
  ).join("");
  poolEl.innerHTML = q._shuffled.filter(i => !session.seq.includes(i)).map(i =>
    `<button class="order-item" onclick="orderAdd(${i})">${q.items[i]}</button>`
  ).join("");
  document.getElementById("actionBtn").disabled = session.seq.length !== q.items.length;
}
function orderAdd(i) { if (session.answered) return; session.seq.push(i); renderOrder(); }
function orderRemove(pos) { if (session.answered) return; session.seq.splice(pos, 1); renderOrder(); }

/* verificação */
function verify() {
  const s = session;
  if (s.answered) { advance(); return; }
  const q = s.queue[s.idx].q;
  let ok = false;

  if (q.type === "mc" || q.type === "output") {
    ok = s.picked === q.answer;
    document.querySelectorAll(".opt").forEach(el => {
      const i = +el.dataset.i; el.disabled = true;
      if (i === q.answer) el.classList.add("correct");
      else if (i === s.picked) el.classList.add("wrong");
    });
  } else if (q.type === "vf") {
    const want = q.answer ? 1 : 0;
    ok = s.picked === want;
    document.querySelectorAll(".opt").forEach(el => {
      const i = +el.dataset.i; el.disabled = true;
      if (i === want) el.classList.add("correct");
      else if (i === s.picked) el.classList.add("wrong");
    });
  } else if (q.type === "fill") {
    const inp = document.getElementById("fillInput");
    const val = normFill(inp.value);
    ok = q.accept.some(a => normFill(a) === val);
    inp.disabled = true;
    inp.classList.add(ok ? "correct" : "wrong");
    const slot = document.getElementById("blankSlot");
    if (slot) { slot.textContent = ok ? inp.value.trim() : q.accept[0]; }
  } else if (q.type === "order") {
    ok = s.seq.every((v, idx) => v === idx) && s.seq.length === q.items.length;
    const seqEl = document.getElementById("orderSeq");
    seqEl.classList.add(ok ? "correct" : "wrong");
    if (!ok) {
      // mostra a ordem correta
      seqEl.innerHTML = q.items.map((txt, pos) => `<div class="order-slot"><span class="num">${pos + 1}</span><span>${txt}</span></div>`).join("");
      document.getElementById("orderPool").innerHTML = "";
    }
    document.querySelectorAll(".order-item").forEach(el => el.disabled = true);
  }

  s.answered = true;
  const fb = document.getElementById("feedback");
  fb.classList.add("show", ok ? "ok" : "no");
  document.getElementById("fbTitle").textContent = ok ? "Correto!" : "Não foi dessa vez";
  document.getElementById("fbBody").innerHTML = q.explain;

  if (ok) {
    s.correct++;
    if (s.mode === "review") s.clearedRefs.push(s.queue[s.idx].ref);
  } else {
    s.mistakes++;
    if (s.mode === "module") {
      s.hearts--;
      addMissed(s.mod.id, s.queue[s.idx].i);
    }
  }

  const btn = document.getElementById("actionBtn");
  if (s.mode === "module" && s.hearts <= 0) {
    btn.textContent = "Ver resultado"; btn.onclick = () => failModule();
  } else {
    btn.textContent = (s.idx + 1 >= s.queue.length) ? "Concluir" : "Continuar";
    btn.onclick = advance;
  }
}

function addMissed(m, i) {
  if (!state.missed.some(r => r.m === m && r.i === i)) { state.missed.push({ m, i }); save(); }
}

function advance() {
  const s = session;
  if (s.idx + 1 < s.queue.length) { s.idx++; renderQuestion(); }
  else { finishSession(); }
}

function quitToHub() { session = null; renderHub(); }

function failModule() {
  const s = session;
  document.getElementById("app").innerHTML = `
    <div class="result">
      <div class="r-emoji">💔</div>
      <h2>Vidas esgotadas</h2>
      <p class="r-sub">Você acertou ${s.correct} de ${s.idx + 1} antes de perder os corações. Reveja o manual e tente de novo — sem pressa.</p>
      <div class="r-actions">
        <button class="btn" onclick="startModule('${s.mod.id}')">↻ Tentar de novo</button>
        <button class="btn ghost" onclick="quitToHub()">Voltar ao mapa</button>
      </div>
      <a class="read-link" href="${s.mod.file}" target="_blank" rel="noopener">📖 Abrir o ${esc(s.mod.vol)} — ${esc(s.mod.title)}</a>
    </div>`;
  window.scrollTo(0, 0);
}

function finishSession() {
  const s = session;
  if (s.mode === "review") return finishReview();

  const total = s.queue.length;
  const perfect = s.mistakes === 0;
  const moduleXp = s.correct * 10 + (perfect ? 30 : 0);
  const prev = state.completed[s.mod.id];
  const prevXp = prev ? prev.xp : 0;
  let gained = 0;
  if (moduleXp > prevXp) { gained = moduleXp - prevXp; state.xp += gained; }

  // só registra como concluído se chegou ao fim com vidas
  const wasNew = !prev;
  state.completed[s.mod.id] = { correct: s.correct, total, perfect, xp: Math.max(moduleXp, prevXp) };
  save();

  const beforeLvl = levelInfo(state.xp - gained).lvl;
  const afterLvl = levelInfo(state.xp).lvl;
  const newBadges = refreshBadges();

  const emoji = perfect ? "🏆" : (s.correct / total >= 0.6 ? "🎉" : "👏");
  const heading = perfect ? "Módulo impecável!" : "Módulo concluído!";

  let extras = "";
  if (afterLvl > beforeLvl) extras += `<div class="nb">⬆️ Subiu para o nível ${afterLvl}!</div>`;
  newBadges.forEach(b => extras += `<div class="nb">${b.emoji} Nova conquista: ${esc(b.name)}</div>`);

  document.getElementById("app").innerHTML = `
    <div class="result">
      <div class="r-emoji">${emoji}</div>
      <h2>${heading}</h2>
      <p class="r-sub">${esc(s.mod.vol)} — ${esc(s.mod.title)}</p>
      ${extras ? `<div class="r-new-badges">${extras}</div>` : ""}
      <div class="r-stats">
        <div class="r-stat"><div class="v">${s.correct}/${total}</div><div class="l">Acertos</div></div>
        <div class="r-stat"><div class="v">+${gained}</div><div class="l">XP ganho</div></div>
        <div class="r-stat"><div class="v">${"★".repeat(scoreStars({correct:s.correct,total}))}${"☆".repeat(3-scoreStars({correct:s.correct,total}))}</div><div class="l">Estrelas</div></div>
      </div>
      <div class="r-actions">
        ${nextModuleBtn(s.mod)}
        <button class="btn ghost" onclick="startModule('${s.mod.id}')">↻ Repetir</button>
        <button class="btn ghost" onclick="quitToHub()">Mapa</button>
      </div>
      <a class="read-link" href="${s.mod.file}" target="_blank" rel="noopener">📖 Reler o ${esc(s.mod.vol)} — ${esc(s.mod.title)}</a>
    </div>`;
  window.scrollTo(0, 0);
  if (afterLvl > beforeLvl) toast(`⬆️ <strong>Nível ${afterLvl}</strong> alcançado!`);
}

function nextModuleBtn(mod) {
  const ord = orderedModules();
  const idx = ord.findIndex(m => m.id === mod.id);
  const next = ord[idx + 1];
  if (next) return `<button class="btn" onclick="startModule('${next.id}')">Próximo: ${esc(next.title)} →</button>`;
  return `<button class="btn" onclick="quitToHub()">🎓 Ver o mapa</button>`;
}

function finishReview() {
  const s = session;
  // remove os refs resolvidos da lista de erros
  state.missed = state.missed.filter(r => !s.clearedRefs.some(c => c.m === r.m && c.i === r.i));
  save();
  const cleared = s.clearedRefs.length;
  const remaining = state.missed.length;
  refreshBadges();
  document.getElementById("app").innerHTML = `
    <div class="result">
      <div class="r-emoji">${remaining === 0 ? "✅" : "🔁"}</div>
      <h2>Revisão concluída</h2>
      <p class="r-sub">Você resolveu ${cleared} de ${s.queue.length} questões revisadas.${remaining ? " Ainda restam " + remaining + " na lista." : " Sua lista de erros está zerada!"}</p>
      <div class="r-actions">
        ${remaining ? `<button class="btn" onclick="startReview()">Continuar revisando</button>` : ""}
        <button class="btn ghost" onclick="quitToHub()">Voltar ao mapa</button>
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

function resetAll() {
  if (!confirm("Zerar todo o progresso (XP, níveis, conquistas e módulos)? Isso não pode ser desfeito.")) return;
  localStorage.removeItem(SKEY);
  state = load();
  renderHub();
}

/* embaralha os itens de ordering uma vez (estável por questão) */
function prepShuffles() {
  MODULES.forEach(m => m.questions.forEach(q => {
    if (q.type === "order" && !q._shuffled) {
      const arr = q.items.map((_, i) => i);
      for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
      // garante que não comece já ordenado
      if (arr.every((v, i) => v === i)) arr.reverse();
      q._shuffled = arr;
    }
  }));
}

/* deep-link: jogo.html#moduleId abre o módulo (se desbloqueado) */
function handleHash() {
  const id = location.hash.replace("#", "");
  if (id && moduleById(id)) {
    const mod = moduleById(id);
    if (isUnlocked(mod)) { startModule(id); return true; }
  }
  return false;
}

prepShuffles();
if (!handleHash()) renderHub();
window.addEventListener("hashchange", () => { if (!handleHash()) renderHub(); });
</script>
